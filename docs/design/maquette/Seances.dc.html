<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MyMuscle — Programme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f5f5f4}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0a0a0a; color: #f5f5f4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex-grow: 1; padding: 32px 24px 0; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.03em">Programme</h1>
      <button type="button" aria-label="Ajouter une séance" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid #292524; background: transparent; color: #f5f5f4; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>

    <div role="tablist" aria-label="Cycle" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #161615; border-radius: 999px; padding: 6px">
      <button type="button" role="tab" aria-selected="true" style="height: 48px; border-radius: 999px; border: none; background: {{accent}}; color: #0a0a0a; font: 700 15px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px">A</span> En cours
      </button>
      <button type="button" role="tab" aria-selected="false" style="height: 48px; border-radius: 999px; border: none; background: transparent; color: #a8a29e; font: 500 15px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; color: #f5f5f4">B</span> dans {{daysToB}} j
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 14px; font-weight: 500">Durée du cycle A</span>
        <div role="radiogroup" aria-label="Durée du cycle A" style="display: flex; gap: 4px; background: #161615; border-radius: 999px; padding: 4px">
          <button type="button" role="radio" aria-checked="{{two}}" onClick="{{setTwo}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: {{twoBg}}; color: {{twoFg}}; font-family: Inter, sans-serif; font-size: 13px; font-weight: {{twoW}}; cursor: pointer">2 sem.</button>
          <button type="button" role="radio" aria-checked="{{three}}" onClick="{{setThree}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: {{threeBg}}; color: {{threeFg}}; font-family: Inter, sans-serif; font-size: 13px; font-weight: {{threeW}}; cursor: pointer">3 sem.</button>
        </div>
      </div>
      <span style="font-size: 13px; color: #a8a29e; line-height: 1.45">{{durationHint}}</span>
    </div>

    <div style="display: flex; flex-direction: column">
      <a href="SeanceEnCours.dc.html" style="text-decoration: none; padding: 18px 0; border-top: 1px solid #1f1f1d; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em"><span style="color: {{accent}}">A1</span> Haut du corps</span>
          <span style="font-size: 12px; font-weight: 700; color: #0a0a0a; background: {{accent}}; padding: 4px 10px; border-radius: 999px">Aujourd'hui</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
          <div style="display: flex; justify-content: space-between"><span>Développé couché</span><span style="color: #a8a29e">2–3 séries</span></div>
          <div style="display: flex; justify-content: space-between"><span>Tractions lestées</span><span style="color: #a8a29e">2–3 séries</span></div>
          <div style="display: flex; justify-content: space-between"><span>Développé militaire</span><span style="color: #a8a29e">2–3 séries</span></div>
          <div style="display: flex; justify-content: space-between"><span style="color: #a8a29e">+2 exercices</span></div>
        </div>
      </a>

      <a href="SeanceEnCours.dc.html" style="text-decoration: none; padding: 18px 0; border-top: 1px solid #1f1f1d; border-bottom: 1px solid #1f1f1d; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em"><span style="color: {{accent}}">A2</span> Bas du corps</span>
          <span style="font-size: 13px; color: #a8a29e">il y a 2 j</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
          <div style="display: flex; justify-content: space-between"><span>Squat</span><span style="color: #a8a29e">2–3 séries</span></div>
          <div style="display: flex; justify-content: space-between"><span>Soulevé de terre roumain</span><span style="color: #a8a29e">2–3 séries</span></div>
          <div style="display: flex; justify-content: space-between"><span style="color: #a8a29e">+3 exercices</span></div>
        </div>
      </a>
    </div>
  </div>

  <nav aria-label="Navigation principale" style="margin: 0 24px 24px; height: 64px; border-radius: 999px; background: #161615; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 6px">
    <a href="Main.dc.html" aria-label="Accueil" style="height: 52px; color: #a8a29e; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"></path></svg>
    </a>
    <a href="Seances.dc.html" aria-current="page" aria-label="Programme" style="height: 52px; border-radius: 999px; background: #f5f5f4; color: #0a0a0a; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10.5v3M21 10.5v3M6 12h12"></path></svg>
    </a>
    <a href="Performances.dc.html" aria-label="Records" style="height: 52px; color: #a8a29e; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 3 7-8"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="Exercices" style="height: 52px; color: #a8a29e; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#d4f53c","options":["#d4f53c","#ff6b3d","#7dd3fc","#f5f5f4"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { weeks: 2 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#d4f53c';
    const three = this.state.weeks === 3;
    return {
      accent,
      two: three ? 'false' : 'true',
      three: three ? 'true' : 'false',
      twoBg: three ? 'transparent' : '#f5f5f4',
      twoFg: three ? '#a8a29e' : '#0a0a0a',
      twoW: three ? '500' : '700',
      threeBg: three ? '#f5f5f4' : 'transparent',
      threeFg: three ? '#0a0a0a' : '#a8a29e',
      threeW: three ? '700' : '500',
      setTwo: () => this.setState({ weeks: 2 }),
      setThree: () => this.setState({ weeks: 3 }),
      daysToB: three ? '11' : '4',
      durationHint: three
        ? 'Semaine manquée : A est prolongé d’une semaine. B commence dans 11 jours, puis l’alternance reprend à 2 semaines.'
        : 'Mêmes muscles que B, autres mouvements. Une semaine manquée ? Passe à 3 semaines, la bascule vers B sera décalée.'
    };
  }
}
</script>
</body>
</html>
