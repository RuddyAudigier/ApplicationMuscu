<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MyMuscle — Fin de séance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f5f5f4}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0a0a0a; color: #f5f5f4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px">
  <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
    <span style="font-size: 13px; color: #a8a29e"><span style="color: {{accent}}; font-weight: 700">A1</span> Haut du corps · lundi 23/11 · 52 min</span>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.03em">Séance terminée</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; flex-shrink: 0">
    <div style="border-radius: 18px; background: {{accent}}; color: #0a0a0a; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">4</span><span style="font-size: 12px; font-weight: 600">PR</span>
    </div>
    <div style="border-radius: 18px; background: #161615; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">12</span><span style="font-size: 12px; color: #a8a29e">séries</span>
    </div>
    <div style="border-radius: 18px; background: #161615; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">5</span><span style="font-size: 12px; color: #a8a29e">exercices</span>
    </div>
  </div>

  <div style="flex: 1 1 0; min-height: 0; overflow-y: auto; margin-top: 16px; display: flex; flex-direction: column">
    <sc-for list="{{exercises}}" as="ex" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; padding: 14px 0 6px; border-top: 1px solid #1f1f1d; flex-shrink: 0">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-size: 16px; font-weight: 600">{{ex.name}}</span>
          <span style="font-size: 12px; color: #a8a29e">{{ex.count}}</span>
        </div>
        <sc-for list="{{ex.series}}" as="s" hint-placeholder-count="2">
          <div style="display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 40px; gap: 8px; align-items: center; min-height: 36px">
            <span style="font-size: 12px; color: #78716c">{{s.n}}</span>
            <span style="display: flex; flex-direction: column"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700">{{s.perf}}</span><span style="font-size: 11px; color: #a8a29e">{{s.variant}}</span></span>
            <span style="font-size: 12px; color: #a8a29e">RPE {{s.rpe}}</span>
            <sc-if value="{{s.pr}}" hint-placeholder-val="{{ false }}">
              <span style="justify-self: end; font-size: 10px; font-weight: 700; color: #0a0a0a; background: {{accent}}; padding: 3px 7px; border-radius: 999px">PR</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <button type="button" style="height: 58px; flex-shrink: 0; margin-top: 12px; border-radius: 999px; border: none; background: {{accent}}; color: #0a0a0a; font: 700 17px Inter, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"></path></svg>
    Envoyer au coach (PDF)
  </button>
  <a href="Main.dc.html" style="height: 44px; flex-shrink: 0; margin-top: 4px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #a8a29e; font-size: 14px">Retour à l'accueil</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#d4f53c","options":["#d4f53c","#ff6b3d","#7dd3fc","#f5f5f4"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#d4f53c';
    const s = (n, perf, variant, rpe, pr) => ({ n: 'S' + n, perf, variant, rpe: String(rpe), pr });
    const exercises = [
      { name: 'Développé couché', count: '3 séries', series: [s(1, '4 × 100 kg', 'Classique', 9, true), s(2, '5 × 82,5 kg', 'Pausé 2 ct', 9, false), s(3, '6 × 80 kg', 'Pausé 2 ct', 10, false)] },
      { name: 'Tractions lestées', count: '3 séries', series: [s(1, '6 × +22,5 kg', 'Classique', 9, true), s(2, '8 × +15 kg', 'Classique', 9, false), s(3, '8 × +15 kg', 'Classique', 10, false)] },
      { name: 'Développé militaire', count: '2 séries · fatigué', series: [s(1, '5 × 60 kg', 'Classique', 9, false), s(2, '7 × 55 kg', 'Classique', 9, true)] },
      { name: 'Curl', count: '2 séries', series: [s(1, '8 × 20 kg', 'Wide curl', 9, true), s(2, '10 × 17,5 kg', 'Classique', 9, false)] }
    ];
    return { accent, exercises };
  }
}
</script>
</body>
</html>
