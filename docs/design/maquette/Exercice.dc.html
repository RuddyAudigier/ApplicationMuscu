<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MyMuscle — Exercice et variantes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f5f5f4}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0a0a0a; color: #f5f5f4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex-grow: 1; padding: 20px 24px 0; display: flex; flex-direction: column; gap: 16px">
    <a href="Main.dc.html" aria-label="Retour aux exercices" style="width: 44px; height: 44px; border-radius: 999px; background: #161615; display: flex; align-items: center; justify-content: center; color: #f5f5f4">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.03em">Curl</h1>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="font-size: 12px; font-weight: 700; color: #0a0a0a; background: {{accent}}; padding: 4px 10px; border-radius: 999px">Cycle A</span>
        <span style="font-size: 12px; font-weight: 700; color: #0a0a0a; background: {{accent}}; padding: 4px 10px; border-radius: 999px">Cycle B</span>
        <span style="font-size: 12px; color: #d6d3d1; border: 1px solid #292524; padding: 4px 10px; border-radius: 999px">Biceps</span>
        <span style="font-size: 12px; color: #d6d3d1; border: 1px solid #292524; padding: 4px 10px; border-radius: 999px">Avant-bras</span>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 18px; background: #161615">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a8a29e">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        Remarques du coach · affichées en séance
      </span>
      <textarea rows="2" style="background: transparent; border: none; outline: none; resize: none; color: #f5f5f4; font: 400 14px/1.45 Inter, sans-serif; padding: 0">Supiner en haut, ne pas balancer le buste.
Descente en 3 s.</textarea>
    </label>

    <div style="display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px">
        <span style="font-size: 13px; color: #a8a29e">Variantes · records séparés</span>
        <span style="font-size: 13px; color: #a8a29e">Meilleur e1RM</span>
      </div>
      <sc-for list="{{variants}}" as="v" hint-placeholder-count="5">
        <a href="Performances.dc.html" style="text-decoration: none; display: grid; grid-template-columns: minmax(0, 1fr) auto 20px; gap: 10px; align-items: center; min-height: 52px; border-top: 1px solid #1f1f1d">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 500">{{v.name}}</span>
            <span style="font-size: 12px; color: #a8a29e">{{v.meta}}</span>
          </span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">{{v.best}}</span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
      <div style="border-top: 1px solid #1f1f1d"></div>
    </div>

    <div style="display: flex; gap: 8px">
      <label style="flex-grow: 1; height: 52px; border-radius: 999px; border: 1px dashed #3f3f3c; display: flex; align-items: center; padding: 0 18px">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nom de la nouvelle variante</span>
        <input type="text" placeholder="Nouvelle variante…" style="background: transparent; border: none; outline: none; color: #f5f5f4; font: 500 15px Inter, sans-serif; width: 100%">
      </label>
      <button type="button" aria-label="Ajouter la variante" style="width: 52px; height: 52px; border-radius: 999px; border: none; background: {{accent}}; color: #0a0a0a; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>

  <nav aria-label="Navigation principale" style="margin: 0 24px 24px; height: 64px; border-radius: 999px; background: #161615; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 6px">
    <a href="Main.dc.html" aria-label="Accueil" style="height: 52px; color: #a8a29e; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"></path></svg>
    </a>
    <a href="Seances.dc.html" aria-label="Programme" style="height: 52px; color: #a8a29e; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10.5v3M21 10.5v3M6 12h12"></path></svg>
    </a>
    <a href="Performances.dc.html" aria-label="Records" style="height: 52px; color: #a8a29e; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 3 7-8"></path></svg>
    </a>
    <a href="Exercice.dc.html" aria-current="page" aria-label="Exercices" style="height: 52px; border-radius: 999px; background: #f5f5f4; color: #0a0a0a; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#d4f53c","options":["#d4f53c","#ff6b3d","#7dd3fc","#f5f5f4"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#d4f53c';
    const variants = [
      { name: 'Classique', meta: 'Par défaut · 14 records', best: '27,5 kg' },
      { name: 'Pausé 2 ct en bas', meta: '6 records', best: '22 kg' },
      { name: 'Pausé 2 ct en haut', meta: '4 records', best: '23,5 kg' },
      { name: 'Wide curl', meta: '5 records', best: '19 kg' },
      { name: 'Demi-amplitude', meta: '3 records', best: '31 kg' }
    ];
    return { accent, variants };
  }
}
</script>
</body>
</html>
